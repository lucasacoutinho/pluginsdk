name: check

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for this verification
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - pluginsdk-ephemeral

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: leanprover/lean-action@v1
        if: runner.environment == 'github-hosted'
        with:
          lake-package-directory: spec
          auto-config: false
          build: false
          test: false
          lint: false

      - run: npm run check
