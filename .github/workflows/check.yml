name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: spec
          auto-config: false
          build: false
          test: false
          lint: false

      - run: npm run check
